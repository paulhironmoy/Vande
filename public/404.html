<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>VANDE</title>
    <style>
      html { background: #07111f; color: #f7f9fc; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; }
      p { opacity: 0.8; }
    </style>
    <script>
      // Static-host SPA fallback (GitHub Pages serves this for unknown paths).
      // Remember the requested in-app path, then load the app shell from the base path.
      (function () {
        var path = location.pathname;
        var base = '/';
        if (/\.github\.io$/i.test(location.hostname)) {
          var first = path.split('/')[1];
          base = first ? '/' + first + '/' : '/';
        }
        var rest = path.slice(base.length - 1) || '/';
        try {
          sessionStorage.setItem('vandeRedirect', rest + location.search + location.hash);
        } catch (e) {
          /* storage unavailable: the query string still carries ?c= challenge codes */
        }
        location.replace(base + location.search + location.hash);
      })();
    </script>
  </head>
  <body>
    <p>Opening VANDE…</p>
  </body>
</html>
