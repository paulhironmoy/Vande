# VANDE community API (Cloudflare Workers + D1). Nothing is deployed by this file alone — see backend/README.md.
name = "vande-community"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://paulhironmoy.github.io,https://localhost,capacitor://localhost"
MIN_COHORT = "25"
CONTENT_VERSIONS = ""   # comma-separated allow-list; empty = accept any well-formed version
# Per-network limits (IPv4 /32, IPv6 /64; salted hash, never the address). These values apply to the D1 fallback; with
# the [[ratelimits]] bindings below (the production path) each binding's own limit applies instead.
RATE_LIMIT_PER_MINUTE = "30"         # result submissions per network per minute
RATE_LIMIT_READS_PER_MINUTE = "120"  # stats and goal reads, limited only on an edge-cache miss
RATE_LIMIT_GLOBAL_WRITES_PER_MINUTE = "1200"  # all POSTs together (the ceiling address rotation cannot pass)
RATE_LIMIT_GLOBAL_READS_PER_MINUTE = "2400"   # all uncached reads together
VERSION = "1.0.0"
# D1 statements one daily cleanup may run (each deletes up to 2,000 rows). 45 keeps under the Free plan's 50 queries per
# invocation and clears up to 90,000 rows a run; on Workers Paid raise it (up to 1000) past about 100,000 monthly
# players (docs/COST.md). A run that leaves rows behind reports cleanup_incomplete and logs a warning.
CLEANUP_MAX_QUERIES = "45"
# Verified dares (POST /v1/lite/attempts, POST /v1/lite/attempts/:id/grade, GET /v1/lite/goal/:day).
RATE_LIMIT_DARES_PER_MINUTE = "60"   # start + grade per network per minute (salted hash); generous for school networks
LITE_VERIFY_REPLAY = "0"             # "1" replays each dare before signing (marker v); needs Workers Paid CPU limits
KILL_LITE_DARES = "0"                # "1" switches the verified-dare endpoints off (503) without removing the secret
LITE_GOAL_PER_ADDRESS_PER_DAY = "3"  # replay-verified answers one network can add to the daily goal ("0" = goal off)
# DARE_SIGNING_KEY is a secret: the P-256 private key as a JWK, printed by `node scripts/lite-dare-keys.mjs`.
#   `wrangler secret put DARE_SIGNING_KEY` (never commit it). Without it the dare endpoints FAIL CLOSED (503) and
#   the app keeps using local twists and unsigned replies.
# RATE_SALT is a secret: `wrangler secret put RATE_SALT` (never commit it).
# Without it the worker FAILS CLOSED: POST /results answers 503 until the salt exists.
# Local development only: set ALLOW_UNLIMITED_WRITES = "1" (e.g. in .dev.vars) to accept writes without a salt;
# the worker logs a warning once per isolate. Never set it in production.

# The Worker bundles the app's own engine, Lite replay, scoring, card kinds and twist pool through the `@/` alias
# (backend/tsconfig.json "paths", which wrangler's bundler reads). Those modules mention Vite's import.meta.env; it is
# replaced here so they load in Workers exactly as in the app's production build.
[define]
"import.meta.env.DEV" = "false"
"import.meta.env.PROD" = "true"
"import.meta.env.BASE_URL" = "\"/\""

# Workers Rate Limiting bindings (the preferred limiter: no D1 writes; counters are per Cloudflare location and
# approximate). Keys are salted hashes of the network, never addresses. namespace_id must be a positive integer unique
# in your Cloudflare account; change these if they clash. period must be 10 or 60 seconds. Without a binding the
# Worker falls back to D1 buckets (tests, local development). [[ratelimits]] needs wrangler 4.36.0 or later; older
# versions spelled it [[unsafe.bindings]] with type = "ratelimit".
[[ratelimits]]
name = "RL_WRITE"        # result submissions per network
namespace_id = "7301"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_READ"         # uncached stats and goal reads per network
namespace_id = "7302"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "RL_DARE"         # verified-dare start + grade per network
namespace_id = "7303"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_GLOBAL"       # global ceilings, keys "all-writes" and "all-reads" (per Cloudflare location)
namespace_id = "7304"
simple = { limit = 1200, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "vande-community"
database_id = "REPLACE_WITH_D1_DATABASE_ID"   # created with `wrangler d1 create vande-community`
migrations_dir = "migrations"

[triggers]
crons = ["17 3 * * *"]   # daily prune: lite_attempts > 7 days, results and daily_stats > 180 days, lite_goal > 180 days, rate buckets > 24 h

# Workers Logs are OFF here on purpose (new Workers have them on by default): invocation logs keep every request's
# method and URL (which holds attempt ids) with request and response metadata for 3 days (Free) or 7 days (Paid), a
# per-request record docs/PRIVACY.md says the backend does not keep. To debug knowingly, update docs/PRIVACY.md first,
# set enabled = true for a short window with invocation_logs = false (only the Worker's own warnings, which never
# contain addresses or attempt ids), then turn it off again. See docs/BACKEND.md.
[observability]
enabled = false

[observability.logs]
invocation_logs = false
